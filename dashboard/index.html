<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlWithEye Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="status-dot"></div>
        <h1>CWE</h1>
        <span id="status-label">Bağlanıyor...</span>
    </header>

    <main>
        <div id="canvas-wrap">
            <canvas id="gaze-canvas" width="640" height="480"></canvas>
        </div>

        <aside>
            <div class="panel">
                <h2>Durum</h2>
                <div class="stats">
                    <div class="stat-box"><div class="label">Frame ID</div><div class="value" id="stat-frame">-</div></div>
                    <div class="stat-box"><div class="label">Confidence</div><div class="value" id="stat-conf">-</div></div>
                    <div class="stat-box"><div class="label">Gecikme</div><div class="value" id="stat-lat">-</div></div>
                    <div class="stat-box"><div class="label">Konum</div><div class="value" id="stat-pos">-</div></div>
                </div>
                <div id="latency-bar-wrap"><div id="latency-bar"></div></div>
            </div>

            <div class="panel">
                <h2>Göz Durumu</h2>
                <div class="eyes">
                    <div class="eye-box open" id="eye-left">
                        <div class="eye-label">SOL</div>
                        <div class="eye-icon" id="eye-left-icon">👁</div>
                    </div>
                    <div class="eye-box open" id="eye-right">
                        <div class="eye-label">SAĞ</div>
                        <div class="eye-icon" id="eye-right-icon">👁</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Kalibrasyon</h2>
                <p id="center-status" style="font-size:12px;color:#d29922;margin:0 0 6px;">Merkez bekleniyor...</p>
                <button id="center-btn" onclick="resetCenter()" style="width:100%;padding:8px;background:rgb(45,35,110);color:white;border:1px solid #58a6ff;border-radius:6px;font-size:12px;cursor:pointer;margin-bottom:8px;">Merkez Sıfırla</button>
                <p id="cal-status" style="font-size:12px;color:#8d96a0;margin:0 0 8px;">Henüz kalibre edilmedi.</p>
                <button id="cal-btn" onclick="startCalibration()">Kalibre Et</button>
            </div>

            <div class="panel flex-fill">
                <h2>Event Geçmişi</h2>
                <div id="event-log"></div>
            </div>
        </aside>
    </main>

    <!-- Kalibrasyon overlay -->
    <div id="cal-overlay">
        <div id="cal-instruction">Noktalara sırayla bakın</div>
        <canvas id="cal-canvas"></canvas>
        <div id="cal-info"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
